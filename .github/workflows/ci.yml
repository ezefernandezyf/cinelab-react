name: CI

on:
  push:
    branches: [main, master, develop, 'feature/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: stable

      - name: Install dependencies (bun)
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Test (coverage)
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Upload coverage (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
